<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brokerska Kompanija - Grafici</title>
    <!-- Stilovi radi lepšeg pregleda i centriranja -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Polar Area Chart -->
        <div class="chart-card">
            <h3>1. Investicije po finansijskim instrumentima</h3>
            <canvas id="polarChart"></canvas>
        </div>

        <!-- 2. Pie Chart -->
        <div class="chart-card">
            <h3>2. Raspodela ulaganja po sektorima (%)</h3>
            <canvas id="pieChart"></canvas>
        </div>

        <!-- 3. Line Chart -->
        <div class="chart-card">
            <h3>3. Vrednost portfolija kroz vreme</h3>
            <canvas id="lineChart"></canvas>
        </div>

        <!-- 4. Bar Chart -->
        <div class="chart-card">
            <h3>4. Troškovi kod brokera po mesecima</h3>
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <!-- Učitavanje Chart.js biblioteke preko CDN-a -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // --- 1. POLAR AREA CHART ---
        const ctxPolar = document.getElementById('polarChart').getContext('2d');
        new Chart(ctxPolar, {
            type: 'polarArea',
            data: {
                labels: ['Stocks', 'Bonds', 'ETFs', 'Crypto'],
                datasets: [{
                    label: 'Iznos (USD)',
                    data: [5000, 2000, 3000, 1000],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(75, 192, 192, 0.6)'
                    ]
                }]
            }
        });

        // --- 2. PIE CHART ---
        const ctxPie = document.getElementById('pieChart').getContext('2d');
        new Chart(ctxPie, {
            type: 'pie',
            data: {
                labels: ['Tech', 'Healthcare', 'Energy', 'Finance'],
                datasets: [{
                    label: 'Procenat ulaganja',
                    data: [40, 25, 15, 20],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)',
                        'rgba(54, 162, 235, 0.7)',
                        'rgba(255, 206, 86, 0.7)',
                        'rgba(153, 102, 255, 0.7)'
                    ]
                }]
            }
        });

        // --- 3. LINE CHART ---
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Vrednost portfolija',
                    data: [10000, 12000, 14000, 13000, 15000, 17000],
                    borderColor: 'rgba(54, 162, 235, 1)',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderWidth: 2,
                    tension: 0.1,
                    fill: true
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // --- 4. BAR CHART ---
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['January', 'February', 'March', 'April', 'May', 'June'],
                datasets: [{
                    label: 'Troškovi (USD)',
                    data: [500, 600, 700, 800, 900, 1000],
                    backgroundColor: 'rgba(255, 159, 64, 0.6)',
                    borderColor: 'rgba(255, 159, 64, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
